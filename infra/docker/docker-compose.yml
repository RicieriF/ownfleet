version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: weego_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weego
      POSTGRES_PASSWORD: weego_dev
      POSTGRES_DB: weego_cmi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weego -d weego_cmi']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: weego_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
