name: ownfleet

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: ownfleet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ownfleet
      POSTGRES_PASSWORD: ownfleet_dev
      POSTGRES_DB: ownfleet
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ownfleet -d ownfleet']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ownfleet_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
